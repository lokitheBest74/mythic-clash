<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b17">
<meta name="description" content="MYTHIC CLASH — a story-driven anime RPG. Summon heroes, forge your party, and close the Rift.">
<title>MYTHIC CLASH</title>
<!-- Real fonts, actually loaded (the old build declared these but never loaded them) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   MYTHIC CLASH — full RPG rebuild
   Mobile-first. Palette: cyan #62eaff / pink #ff548e / gold #ffda7b
   on deep space #080b17. Headings: Oxanium. Body: Rajdhani.
   All artwork loads from separate .jpg files in this folder —
   nothing is embedded, so the page stays fast on phones.
   ================================================================ */
:root{
  --bg:#080b17; --bg2:#0b1121; --panel:#101624; --panel2:#151d2e; --line:#2a354b;
  --muted:#99a8c0; --white:#f3f7ff;
  --cyan:#62eaff; --pink:#ff548e; --gold:#ffda7b; --violet:#a58aff;
  --green:#80ffd1; --red:#ff587b;
  --epic:#b48cff; --legendary:#ffda7b; --mythic:#ff548e; --transcendent:#62eaff;
  --head:'Oxanium',system-ui,sans-serif;
  --body:'Rajdhani','Barlow Condensed',system-ui,sans-serif;
  --shadow:0 20px 60px rgba(0,0,0,.55);
  --r:14px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--white);font-family:var(--body);font-size:17px;line-height:1.45;min-height:100vh;
  background:radial-gradient(ellipse at 75% -10%,#1d2048 0,transparent 45%),
             radial-gradient(ellipse at 0% 30%,#0f2343 0,transparent 38%),var(--bg);
  overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.05}
p{margin:0}
.muted{color:var(--muted)}
.tiny{font-size:13px;letter-spacing:.5px}
.gold{color:var(--gold)} .cyan{color:var(--cyan)} .pink{color:var(--pink)}

/* ---------- layout shell ---------- */
.shell{max-width:1100px;margin:0 auto;min-height:100vh;padding-bottom:96px}
body.in-battle .shell{padding-bottom:0}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(9,13,23,.92);backdrop-filter:blur(14px)}
body.in-battle .top{display:none}
.brand{border:0;background:none;text-align:left;line-height:.9;padding:4px 2px}
.brand strong{font:800 21px var(--head);letter-spacing:-.5px}
.brand strong span{color:var(--pink)}
.brand small{display:block;font-size:9px;letter-spacing:3.4px;color:var(--muted);margin-top:5px}
.profile-chip{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  background:var(--panel);border-radius:999px;padding:5px 12px 5px 6px}
.lvl-badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  font:700 12px var(--head);color:#0a0f1e;background:linear-gradient(135deg,var(--cyan),#388dff);
  box-shadow:0 0 14px rgba(98,234,255,.45)}
.profile-chip .pc-meta{min-width:86px}
.profile-chip .pc-meta b{display:block;font:700 12px var(--head);letter-spacing:.4px}
.xpbar{height:5px;background:#232f47;border-radius:99px;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:99px;transition:width .5s}
.credits-pill{display:flex;align-items:center;gap:5px;font:700 14px var(--head);color:var(--gold)}
.credits-pill i{font-style:normal;font-size:15px}
.main{padding:16px 14px 30px}
.view-anim{animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- bottom navigation (mobile-first) ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(9,13,23,.96);backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.08);
  padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
body.in-battle .bottomnav{display:none}
.navbtn{border:0;background:none;padding:7px 2px 5px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;min-height:52px}
.navbtn .nav-ico{font-size:20px;line-height:1}
.navbtn small{font:700 10px var(--head);letter-spacing:1.2px}
.navbtn.active{color:var(--cyan)}
.navbtn.active small{color:var(--white)}
.navbtn:active{background:rgba(255,255,255,.06)}

/* ---------- buttons & shared pieces ---------- */
.btn{border:1px solid #435572;background:#182238;border-radius:10px;padding:12px 18px;
  font:700 15px var(--head);letter-spacing:.4px;min-height:46px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(120deg,#1a6fe6,#7955e7);border-color:#82cbff55;color:#fff;
  box-shadow:0 8px 26px rgba(55,93,230,.4)}
.btn.goldbtn{background:linear-gradient(120deg,#e8a91c,#ff548e);border-color:#ffd78b66;color:#fff;
  box-shadow:0 8px 26px rgba(232,169,28,.35)}
.btn.ghost{background:transparent}
.btn.danger{background:#3a1420;border-color:#ff587b66;color:#ffb3c2}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.eyebrow{font:700 11px var(--head);letter-spacing:3px;color:var(--cyan);text-transform:uppercase}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-head h2{font-size:22px}
.section-head p{color:var(--muted);font-size:14px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  border-radius:99px;padding:3px 10px;font:700 11px var(--head);letter-spacing:1px}
.chip.cyan{color:var(--cyan);border-color:rgba(98,234,255,.35)}
.chip.gold{color:var(--gold);border-color:rgba(255,218,123,.35)}
.chip.pink{color:var(--pink);border-color:rgba(255,84,142,.35)}
.chip.violet{color:var(--violet);border-color:rgba(165,138,255,.35)}
/* rarity colours */
.r-EPIC{--rc:var(--epic)} .r-LEGENDARY{--rc:var(--legendary)}
.r-MYTHIC{--rc:var(--mythic)} .r-TRANSCENDENT{--rc:var(--transcendent)}
.rarity-tag{font:800 10px var(--head);letter-spacing:1.6px;color:var(--rc);
  border:1px solid var(--rc);border-radius:5px;padding:2px 7px;background:rgba(255,255,255,.05)}

/* ---------- home hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid #364361;
  background:radial-gradient(ellipse at 30% 20%,#1c2a55,#0b1121 70%);min-height:340px;
  display:flex;align-items:flex-end;box-shadow:var(--shadow)}
.hero>img.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(7,11,21,.96) 8%,rgba(7,11,21,.55) 45%,rgba(7,11,21,.15) 75%)}
.hero-copy{position:relative;z-index:2;padding:22px 20px 24px;width:100%}
.hero-copy .title{font-size:clamp(38px,11vw,64px);font-weight:800;letter-spacing:-1.5px;text-transform:uppercase}
.hero-copy .title span{background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-copy p{color:#c1cce0;font-size:17px;max-width:480px;margin:8px 0 16px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-cta .btn{flex:1;min-width:140px}
/* floating particles (JS spawns the dots) */
.particles{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.particle{position:absolute;bottom:-12px;border-radius:50%;background:var(--cyan);opacity:.7;
  animation:rise linear infinite;box-shadow:0 0 10px var(--cyan)}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-360px);opacity:0}}
/* quick action tiles */
.tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:15px 14px;text-align:left;
  background:linear-gradient(145deg,var(--panel2),var(--panel));min-height:96px;position:relative;overflow:hidden}
.tile:active{transform:scale(.98)}
.tile .tile-ico{font-size:24px}
.tile h3{font-size:16px;margin:6px 0 2px}
.tile p{color:var(--muted);font-size:13px;line-height:1.25}
.tile::after{content:"";position:absolute;top:0;right:0;width:70px;height:70px;
  background:radial-gradient(circle at top right,rgba(98,234,255,.16),transparent 70%)}
.tile.pink-tile::after{background:radial-gradient(circle at top right,rgba(255,84,142,.18),transparent 70%)}
.tile.gold-tile::after{background:radial-gradient(circle at top right,rgba(255,218,123,.18),transparent 70%)}
/* party preview strip */
.party-strip{display:flex;gap:10px;margin-top:12px}
.party-mini{flex:1;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);text-align:center}
.party-mini .pm-art{height:74px;position:relative;overflow:hidden}
.party-mini .pm-art img{width:100%;height:100%;object-fit:cover}
.party-mini b{display:block;font:700 12px var(--head);padding:6px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.party-mini small{display:block;color:var(--muted);font-size:11px;padding-bottom:7px}

/* ---------- character art: real images + CSS placeholders ---------- */
/* Every portrait area has a gradient background, so a missing file never
   shows a broken-image icon — the img just hides itself (see imgArt()). */
.portrait{position:relative;overflow:hidden;background:linear-gradient(160deg,#1a2540,#0d1326)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center top;position:relative;z-index:1}
/* Animated placeholder for characters whose art is not drawn yet.
   Element colour comes from --ec, set inline per character. */
.art-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(165deg,#182238,#0a0f1e 70%);
  background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--ec,#62eaff) 34%,transparent),transparent 60%),
             linear-gradient(165deg,#182238,#0a0f1e 70%);overflow:hidden}
.art-ph::before{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.13) 50%,transparent 60%);
  animation:shimmer 3.2s ease-in-out infinite}
@keyframes shimmer{from{transform:translateX(-60%)}60%,to{transform:translateX(60%)}}
.art-ph .rune{font-size:56px;line-height:1;color:var(--ec,#62eaff);text-shadow:0 0 24px var(--ec,#62eaff);animation:runePulse 2.6s ease-in-out infinite}
@keyframes runePulse{50%{transform:scale(1.12);text-shadow:0 0 34px var(--ec,#62eaff)}}
.art-ph .ph-initial{position:absolute;font:800 120px var(--head);color:rgba(255,255,255,.05);top:50%;left:50%;transform:translate(-50%,-50%)}
.art-ph .ph-tag{position:relative;z-index:1;margin-top:10px;font:700 9px var(--head);letter-spacing:2.5px;color:var(--muted)}
/* locked / silhouette */
.locked-art{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(165deg,#141c2e,#080b16);color:#5b6a85}
.locked-art .rune{font-size:44px}
.locked-art span{font:700 10px var(--head);letter-spacing:2px;margin-top:8px}

/* ---------- collection grid ---------- */
.coll-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.char-card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);
  text-align:left;padding:0;position:relative;transition:transform .15s,border-color .15s}
.char-card:active{transform:scale(.97)}
.char-card .portrait{height:158px;border-bottom:1px solid var(--line)}
.char-card .portrait::after{content:"";position:absolute;inset:auto 0 0;height:52%;
  background:linear-gradient(transparent,rgba(8,11,23,.9))}
.char-card .cc-rarity{position:absolute;top:8px;left:8px;z-index:2}
.char-card .cc-body{padding:10px 11px 12px}
.char-card h3{font-size:15px}
.char-card .cc-role{color:var(--muted);font-size:12px;margin:2px 0 7px}
.char-card .cc-stats{display:flex;gap:8px;font:700 12px var(--head);color:#c6d2e4}
.char-card.in-party{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(98,234,255,.4),0 0 22px rgba(98,234,255,.18)}
.char-card.locked{opacity:.85}
.party-bar{display:flex;gap:8px;align-items:stretch;margin-bottom:14px}
.party-slot{flex:1;min-height:64px;border:1px dashed #3a4a68;border-radius:12px;background:rgba(255,255,255,.02);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;text-align:center}
.party-slot.filled{border-style:solid;border-color:var(--cyan);background:linear-gradient(180deg,#12233a,#0e1524)}
.party-slot b{font:700 12px var(--head)}
.party-slot small{color:var(--muted);font-size:10px;letter-spacing:.5px}
.party-slot .remove{color:var(--red);font-size:11px;font-weight:700;margin-top:2px}

/* ---------- story chapters ---------- */
.chapter-grid{display:grid;gap:12px}
.chapter{display:grid;grid-template-columns:86px 1fr;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:linear-gradient(145deg,var(--panel2),var(--panel));text-align:left;padding:0;min-height:118px}
.chapter:active{transform:scale(.99)}
.chapter .ch-num{display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#1a2c52,#0d1424);border-right:1px solid var(--line)}
.chapter .ch-num b{font:800 26px var(--head);color:var(--cyan)}
.chapter .ch-num span{font:700 9px var(--head);letter-spacing:2px;color:var(--muted)}
.chapter .ch-body{padding:13px 14px;min-width:0}
.chapter .ch-body h3{font-size:17px;margin:3px 0 4px}
.chapter .ch-body p{color:var(--muted);font-size:14px;line-height:1.3}
.chapter .ch-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.chapter.locked{opacity:.6}
.chapter.cleared{border-color:rgba(128,255,209,.35)}
.chapter.cleared .ch-num b{color:var(--green)}
/* story dialogue scene */
.story-scene{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#060912,#0b1121);
  display:flex;flex-direction:column;overflow:hidden}
.story-bg{position:absolute;inset:0;opacity:.35}
.story-bg img{width:100%;height:100%;object-fit:cover}
.story-scene .scene-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px}
.story-char{position:relative;z-index:1;flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.story-char .portrait{width:min(78vw,340px);height:min(52vh,420px);border-radius:18px 18px 0 0;
  border:1px solid var(--line);border-bottom:0;box-shadow:0 -10px 50px rgba(0,0,0,.6)}
.story-char .portrait img{object-position:center top}
.dialog-box{position:relative;z-index:2;margin:0 12px calc(14px + env(safe-area-inset-bottom));border:1px solid var(--line);
  border-radius:16px;background:rgba(10,15,27,.94);backdrop-filter:blur(10px);padding:16px 16px 14px;min-height:150px}
.dialog-box .spk{font:800 14px var(--head);letter-spacing:1px;color:var(--cyan);margin-bottom:6px}
.dialog-box .dlg-text{font-size:19px;font-weight:600;line-height:1.35;min-height:52px}
.dialog-box .dlg-actions{display:flex;gap:8px;margin-top:12px}
.dialog-box .dlg-actions .btn{flex:1}

/* ---------- summon ---------- */
.summon-hero{text-align:center;padding:26px 16px 20px;border-radius:18px;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,rgba(165,138,255,.28),transparent 60%),linear-gradient(180deg,#141a30,#0b1121)}
.summon-hero h2{font-size:30px}
.summon-hero p{color:var(--muted);margin:8px auto 0;max-width:420px;font-size:15px}
.summon-ring{width:150px;height:150px;margin:6px auto 2px;position:relative}
.summon-ring .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(98,234,255,.5);
  box-shadow:0 0 30px rgba(98,234,255,.35),inset 0 0 30px rgba(98,234,255,.2);animation:ringSpin 14s linear infinite}
.summon-ring .ring.r2{inset:16px;border-color:rgba(255,84,142,.45);animation-duration:9s;animation-direction:reverse}
.summon-ring .ring.r3{inset:32px;border-color:rgba(255,218,123,.4);animation-duration:6s}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.summon-ring .core{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;
  text-shadow:0 0 30px var(--cyan);animation:runePulse 2.4s ease-in-out infinite}
.summon-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.summon-btns .btn{flex-direction:column;gap:2px;padding:13px 10px}
.summon-btns .btn small{font:600 12px var(--body);opacity:.85;letter-spacing:.3px}
.odds{margin-top:14px;font-size:13px;color:var(--muted);text-align:center;line-height:1.6}
.summon-results{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.summon-results.single{grid-template-columns:1fr;max-width:300px;margin-left:auto;margin-right:auto}
.summon-card{border:1px solid var(--rc,var(--line));border-radius:12px;overflow:hidden;background:var(--panel);
  animation:summonIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes summonIn{from{opacity:0;transform:scale(.7) rotate(-2deg)}to{opacity:1;transform:none}}
.summon-card .portrait{height:150px}
.summon-card .sc-body{padding:9px 10px 11px;text-align:center}
.summon-card h3{font-size:15px}
.summon-card .dup{color:var(--gold);font-size:12px;font-weight:700;margin-top:3px}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(2,5,12,.82);backdrop-filter:blur(8px);
  display:none;align-items:flex-end;justify-content:center;padding:0}
.overlay.open{display:flex}
.dialog{width:100%;max-width:620px;max-height:92vh;overflow-y:auto;background:linear-gradient(160deg,#182139,#0a0e19 70%);
  border:1px solid #566b95;border-bottom:0;border-radius:18px 18px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));
  animation:dialogIn .3s ease both}
@keyframes dialogIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.dialog .dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dialog h2{font-size:24px;margin:6px 0 4px}
.dialog p{color:#c0cce0;font-size:16px;line-height:1.4}
.dialog .dialog-buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.dialog .dialog-buttons .btn{flex:1;min-width:120px}
.modal-x{width:38px;height:38px;flex-shrink:0;border:1px solid var(--line);background:#111b2c;border-radius:10px;font-size:18px}
.detail-grid{display:grid;gap:14px}
.detail-grid .portrait{height:260px;border-radius:12px;border:1px solid var(--line)}
.lore-quote{border-left:3px solid var(--violet);padding:8px 0 8px 13px;color:#d9d2ff;font-size:17px;font-weight:600;margin:12px 0}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat-box{background:#090f1d;border:1px solid #25324b;border-radius:10px;padding:9px 6px;text-align:center}
.stat-box b{display:block;font:800 18px var(--head)}
.stat-box span{font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:700}
.skill-box{background:#090f1d;border:1px solid #25324b;border-radius:10px;padding:11px 12px;margin-top:8px}
.skill-box b{display:block;font:700 14px var(--head);margin-bottom:3px}
.skill-box span{color:#abb9d0;font-size:14px}
.toast{position:fixed;z-index:130;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  max-width:92vw;background:#111c2d;border:1px solid #76dfff;border-radius:12px;padding:11px 16px;
  box-shadow:var(--shadow);font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.in-battle .toast{bottom:24px}

/* ---------- battle ---------- */
.battle{display:flex;flex-direction:column;min-height:100dvh}
.battle-top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#080d18;
  border-bottom:1px solid #2a3650;position:sticky;top:0;z-index:10}
.battle-top .bt-title{font:800 15px var(--head);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

const CHAPTERS = [
  { id:1, num:"01", title:"The Sky Splits Open", subtitle:"PROLOGUE · MERIDIAN CITY", place:"Meridian City",

// Summon costs + odds (roll 1–100)
const SUMMON_COST_1 = 100, SUMMON_COST_10 = 900;
const DUPLICATE_CREDITS = 50, DUPLICATE_SHARDS = 20;

/* ================= 2) SAVE ================= */
const SAVE_KEY = "mythic-clash-save-v2";
const DEFAULT_SAVE = {
  level:1, xp:0, credits:300, shards:0,
  owned:["sylvaine","seraphine","darius","aurelia"],   // starting collection
  party:["sylvaine","aurelia","darius"],                // starting party of 3
  cleared:[], unlocked:1,                               // story progress
  wave:1, bestWave:0, wins:0, battles:0,
  seenIntro:false
};
let save = loadSave();

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return structuredClone(DEFAULT_SAVE);
    const data = JSON.parse(raw);
    // Merge over defaults so old/missing fields never crash the game.
    const s = Object.assign(structuredClone(DEFAULT_SAVE), data);
    if(!Array.isArray(s.owned) || !s.owned.length) s.owned = [...DEFAULT_SAVE.owned];
    if(!Array.isArray(s.party) || !s.party.length) s.party = [...DEFAULT_SAVE.party];
    if(!Array.isArray(s.cleared)) s.cleared = [];
    s.owned = s.owned.filter(id => CHARS[id]);
    s.party = s.party.filter(id => s.owned.includes(id)).slice(0,3);
    if(s.party.length < 3){
      for(const id of s.owned){ if(s.party.length>=3) break; if(!s.party.includes(id)) s.party.push(id); }
    }
    s.level = Math.max(1, s.level|0 || 1);
    s.xp = Math.max(0, s.xp|0 || 0);
    s.credits = Math.max(0, s.credits|0 || 0);
    s.shards = Math.max(0, s.shards|0 || 0);
    s.unlocked = Math.min(6, Math.max(1, s.unlocked|0 || 1));
    s.wave = Math.max(1, s.wave|0 || 1);
    return s;
  }catch(e){ return structuredClone(DEFAULT_SAVE); }
}
function saveGame(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} syncProfileChip(); }
function xpNeeded(){ return save.level * 100; }
// Level-ups raise all stats a little (5% per level, applied in makeUnit).
function levelMult(){ return 1 + (save.level - 1) * 0.05; }
function gainXP(n){
  save.xp += n;
  while(save.xp >= xpNeeded()){ save.xp -= xpNeeded(); save.level++; showToast("LEVEL UP! You are now level " + save.level + " — all stats up!"); }
}

/* ================= ART HELPERS ================= */
/* Returns the HTML for a character's portrait.
   Real art -> <img> (with an onerror that hides it, so a missing file
   never shows a broken icon — the gradient behind it still looks fine).
   No art -> animated CSS placeholder (rune + element glow + shimmer). */
function artHTML(id){
  const c = CHARS[id]; if(!c) return "";
  const art = ART[id];
  const el = ELEMENTS[c.element] || { color:"#62eaff" };
  const tag = art ? esc(c.element.toUpperCase()) : esc(c.element.toUpperCase()) + " · ART COMING SOON";
  const ph = '<div class="art-ph" style="--ec:'+el.color+'">' +
    '<span class="ph-initial">'+esc(c.short.charAt(0))+'</span>' +
    '<span class="rune">'+c.rune+'</span>' +
    '<span class="ph-tag">'+tag+'</span></div>';
  // The placeholder sits UNDER the img: if the file loads it covers it;
  // if the file fails, the img removes itself and the placeholder shows.
  if(art && art.portrait){
    return '<img src="'+art.portrait+'" alt="'+esc(c.name)+'" loading="lazy" onerror="this.remove()">' + ph;
  }
  return ph;
}
/* Sprite version (used in battle + party strip). Falls back to portrait,
   then to the placeholder. */
function spriteHTML(id){
  const c = CHARS[id]; if(!c) return "";
  const art = ART[id];
  const el = ELEMENTS[c.element] || { color:"#62eaff" };
  const ph = '<div class="art-ph" style="--ec:'+el.color+'"><span class="rune">'+c.rune+'</span></div>';
  if(art && art.sprite){
    return '<img src="'+art.sprite+'" alt="'+esc(c.name)+'" loading="lazy" onerror="this.remove()">' + ph;
  }
  return ph;
}
function rarityTag(r){ return '<span class="rarity-tag r-'+r+'">'+r+'</span>'; }
function elChip(el){
  const e = ELEMENTS[el] || { color:"#62eaff" };
  return '<span class="chip" style="color:'+e.color+';border-color:'+e.color+'66">'+esc(el.toUpperCase())+'</span>';
}

function spawnParticles(){
  const box = $("particles"); if(!box) return;
  const colors = ["#62eaff","#ff548e","#ffda7b","#a58aff"];

    html += '<span class="particle" style="left:' + (Math.random()*100).toFixed(1) + "%;width:" + size.toFixed(1) +
      "px;height:" + size.toFixed(1) + "px;background:" + colors[i%4] + ";box-shadow:0 0 10px " + colors[i%4] +
      ";animation-duration:" + (6+Math.random()*8).toFixed(1) + "s;animation-delay:" + (-Math.random()*10).toFixed(1) + 's"></span>';

function renderStory(){
  const cards = CHAPTERS.map(ch => {
    const locked = ch.id > save.unlocked;

      '<span class="ch-num"><b>' + ch.num + '</b><span>' + (cleared ? "CLEARED ✓" : locked ? "LOCKED" : "CHAPTER") + '</span></span>' +
      '<span class="ch-body"><span class="eyebrow">' + esc(ch.subtitle) + '</span>' +
      "<h3>" + (locked ? "???" : esc(ch.title)) + "</h3>" +
      '<p>' + (locked ? "Clear the previous chapter to unlock this one." : esc(ch.brief)) + "</p>" +
      '<span class="ch-meta">' +
        '<span class="chip gold">◆ +' + ch.reward.credits + "</span>" +
        '<span class="chip cyan">★ +' + ch.reward.xp + " XP</span>" +

// Dialogue scene: shows the chapter's intro lines, then starts the battle.
let storyScene = null;
function startChapter(id){
  const ch = CHAPTERS.find(c => c.id === id);
  if(!ch || id > save.unlocked) return;
  storyScene = { chapter: ch, line: 0 };
  showStoryLine();
}
function showStoryLine(){
  const sc = storyScene; if(!sc) return;
  const ch = sc.chapter;
  const line = ch.dialogue[sc.line];
  // Pick a portrait for the speaker when we have one.
  const speakerMap = { "Sylvaine":"sylvaine", "Aurelia":"aurelia", "Kael Dreadbane":"kael",
    "Darius":"darius", "Seraphine":"seraphine", "Airi Tsukihana":"airi",
    "Raven's Brother":"raven", "Fallen Angel":"fallen", "Ancient Vampire":"vampire",
    "God Killer":"godkiller", "Master Swordswoman":"swordswoman", "Fateborn Guardian":"guardian" };
  const spId = speakerMap[line.s] || null;
  const portrait = spId
    ? '<div class="portrait">' + artHTML(spId) + "</div>"
    : '<div class="portrait"><div class="art-ph" style="--ec:#62eaff"><span class="rune">✦</span><span class="ph-tag">MERIDIAN CITY</span></div></div>';
  const isLast = sc.line >= ch.dialogue.length - 1;
  const scene = document.createElement("div");
  scene.className = "story-scene"; scene.id = "storyScene";
  scene.innerHTML =
    '<div class="story-bg"><img src="arena.jpg" alt="" onerror="this.remove()"></div>' +
    '<div class="scene-top"><div><div class="eyebrow">' + esc(ch.subtitle) + '</div>' +
    '<div style="font:800 17px var(--head)">' + esc(ch.title) + "</div></div>" +
    '<button class="btn ghost" style="min-height:40px;padding:8px 14px" onclick="skipStory()">Skip ▸▸</button></div>' +
    '<div class="story-char">' + portrait + "</div>" +
    '<div class="dialog-box"><div class="spk">' + esc(line.s) + "</div>" +
    '<div class="dlg-text">' + esc(line.t) + "</div>" +
    '<div class="dlg-actions"><button class="btn primary" onclick="nextStoryLine()">' + (isLast ? "⚔ TO BATTLE" : "Next ▸") + "</button></div></div>";
  const old = $("storyScene"); if(old) old.remove();
  document.body.appendChild(scene);
}
function nextStoryLine(){
  const sc = storyScene; if(!sc) return;
  if(sc.line < sc.chapter.dialogue.length - 1){ sc.line++; showStoryLine(); }
  else { const ch = sc.chapter; endStoryScene(); startBattle("story", ch); }
}
function skipStory(){ const ch = storyScene.chapter; endStoryScene(); startBattle("story", ch); }
function endStoryScene(){ const s = $("storyScene"); if(s) s.remove(); storyScene = null; }

    "</div>" +

    "Duplicates become <b style=\"color:var(--gold)\">+" + DUPLICATE_CREDITS + " credits</b> and <b style=\"color:var(--cyan)\">+" + DUPLICATE_SHARDS + " shards</b>.</div>" +
  "</div>" +

    const c = CHARS[id]; const owned = save.owned.includes(id);
    return '<button class="char-card r-' + c.rarity + (owned ? "" : " locked") + '" onclick="showCharDetail(\'' + id + '\')">' +
      '<div class="portrait">' + (owned ? artHTML(id) : '<div class="locked-art"><span class="rune">?</span><span>NOT SUMMONED</span></div>') +
      '<span class="cc-rarity">' + rarityTag(c.rarity) + "</span></div>" +
      '<div class="cc-body"><h3>' + (owned ? esc(c.name) : "???") + "</h3>" +
      '<div class="cc-role">' + (owned ? esc(c.role) : "Unknown hero") + "</div>" +
      '<div class="cc-stats"><span>HP ' + c.hp + "</span><span>ATK " + c.atk + "</span><span>DEF " + c.def + "</span></div></div></button>";
  }).join("") + "</div>";

function rollSummon(){
  const r = Math.floor(Math.random()*100) + 1; // 1–100
  if(r <= 3) return "godkiller";
  if(r <= 8) return "airi";
  if(r <= 18) return Math.random() < .5 ? "sylvaine" : "kael";
  if(r <= 35) return Math.random() < .5 ? "aurelia" : "raven";
  return ROSTER[Math.floor(Math.random()*ROSTER.length)];
}
function doSummon(count){
  const cost = count === 10 ? SUMMON_COST_10 : SUMMON_COST_1;
  if(save.credits < cost){ showToast("Not enough credits! Win battles to earn more."); return; }
  save.credits -= cost;
  const results = [];
  for(let i=0;i<count;i++){
    const id = rollSummon();
    const isNew = !save.owned.includes(id);
    if(isNew) save.owned.push(id);
    else { save.credits += DUPLICATE_CREDITS; save.shards += DUPLICATE_SHARDS; }
    results.push({ id, isNew });
  }
  saveGame();
  // Rarity order for the reveal: rarest last (the exciting one).
  const rank = { EPIC:0, LEGENDARY:1, MYTHIC:2, TRANSCENDENT:3 };
  results.sort((a,b) => rank[CHARS[a.id].rarity] - rank[CHARS[b.id].rarity]);
  const box = $("summonResults");
  box.innerHTML = '<div class="section-head"><div><h2>Summon Results</h2><p>' +
    (results.some(r => !r.isNew) ? "Duplicates converted to credits + shards." : "New heroes joined your team!") + "</p></div></div>" +
    '<div class="summon-results' + (count===1 ? " single" : "") + '">' + results.map((r,i) => {
      const c = CHARS[r.id];
      return '<div class="summon-card r-' + c.rarity + '" style="animation-delay:' + (i*0.12).toFixed(2) + 's">' +
        '<div class="portrait">' + artHTML(r.id) + "</div>" +
        '<div class="sc-body">' + rarityTag(c.rarity) + "<h3>" + esc(c.name) + "</h3>" +

}

/* ================= 8) BATTLE ENGINE ================= */
/* Turn-based RPG combat. A party of 3 fights 1–3 enemies.
   Damage = ATK − floor(DEF/2), minimum 5 (Louvayn's original formula).
   Energy: team shares 10 max, +2 each round. Skills cost energy.
   Ultimates charge by fighting (+25 per attack, +12 when hit). */
let battle = null;

function makeUnit(charId, isEnemy, scale, nameOverride, boss){
  const c = CHARS[charId];
  const mult = isEnemy ? 1 : levelMult(); // player heroes grow with account level
  const hp = Math.round(c.hp * scale * mult);
  return {
    charId, name: nameOverride || c.short, fullName: c.name,
    isEnemy, boss: !!boss,
    maxHp: hp, hp,
    atk: Math.round(c.atk * scale * mult),
    def: Math.max(1, Math.round(c.def * scale)),
    cost: c.cost, skill: c.skill, ult: c.ult,
    ultCharge: 0, skillCd: 0, alive: true
  };
}
function makeArenaTeam(wave){
  const count = wave <= 2 ? 1 : wave <= 5 ? 2 : 3;
  const scale = 0.65 + wave * 0.07; // shadows grow stronger every wave
  const pool = [...ROSTER].sort(() => Math.random() - .5).slice(0, count);
  return pool.map(id => makeUnit(id, true, scale, "Rift Shadow " + CHARS[id].short, false));
}

function startBattle(mode, chapter){
  // Make sure the party is full (auto-fill from owned heroes).
  const party = [...save.party];
  for(const id of save.owned){ if(party.length >= 3) break; if(!party.includes(id)) party.push(id); }
  if(party.length < 3){ showToast("You need 3 heroes in your party!"); return; }
  let enemies, label, sub, reward;
  if(mode === "story"){
    enemies = chapter.enemies.map(e => makeUnit(e.id, true, e.scale, e.name, e.boss));
    label = "CHAPTER " + chapter.num + " — " + chapter.title.toUpperCase();
    sub = chapter.place.toUpperCase();
    reward = chapter.reward;
  } else {
    enemies = makeArenaTeam(save.wave);
    label = "ARENA — WAVE " + save.wave;
    sub = "RIFT SHADOWS · ENDLESS";
    reward = { credits: 40 + save.wave * 12, xp: 30 + save.wave * 8 };
  }
  battle = { mode, chapter, label, sub, reward,
    allies: party.map(id => makeUnit(id, false, 1)),
    enemies, energy: 4, round: 1, active: 0, acted: new Set(), target: 0,
    phase: "player", over: false, animating: false, log: [] };
  document.body.classList.add("in-battle");
  renderBattle();
  logLine(mode === "story" ? "Defeat all enemies to clear the chapter!" : "Survive the Rift Shadows!");
  updateBattleUI();
  window.scrollTo(0, 0);
}

function fighterHTML(u, side, i){

    (side === "ally"
      ? '<div class="ultbar"><i id="ultfill-ally-' + i + '" style="width:' + u.ultCharge + '%"></i></div>'

/* Refreshes bars, pips, buttons and highlights WITHOUT rebuilding the
   stage — so hit animations and damage numbers are not interrupted. */
function updateBattleUI(){
  const b = battle; if(!b) return;
  // Keep the target on a living enemy.
  if(!b.enemies[b.target] || !b.enemies[b.target].alive){
    const t = b.enemies.findIndex(u => u.alive);
    b.target = t === -1 ? 0 : t;
  }
  ["ally","enemy"].forEach(side => {
    const units = side === "ally" ? b.allies : b.enemies;
    units.forEach((u,i) => {
      const el = $("f-" + side + "-" + i); if(!el) return;
      const hpPct = Math.max(0, Math.round(u.hp / u.maxHp * 100));
      const fill = $("hpfill-" + side + "-" + i);
      if(fill) fill.style.width = hpPct + "%";
      const bar = $("hpbar-" + side + "-" + i);
      if(bar) bar.classList.toggle("low", hpPct <= 25 && u.alive);
      const txt = $("hptext-" + side + "-" + i);
      if(txt) txt.textContent = "HP " + Math.max(0, u.hp) + " / " + u.maxHp;
      if(side === "ally"){
        const uf = $("ultfill-ally-" + i);
        if(uf) uf.style.width = u.ultCharge + "%";
      }
      el.classList.toggle("ko", !u.alive);
      el.classList.toggle("active", side === "ally" && i === b.active && b.phase === "player" && !b.over);
      el.classList.toggle("targeted", side === "enemy" && i === b.target && !b.over);
      el.classList.toggle("acted", side === "ally" && b.acted.has(i));
    });
  });
  // Energy pips (10 dots).
  let pips = "";
  for(let i=0;i<10;i++) pips += '<span class="ep' + (i < b.energy ? " on" : "") + '"></span>';
  const pipEl = $("energyPips"); if(pipEl) pipEl.innerHTML = pips;
  const enEl = $("energyNum"); if(enEl) enEl.textContent = b.energy + "/10";
  const rn = $("roundNum"); if(rn) rn.textContent = b.round;
  const tb = $("turnBanner");
  if(tb) tb.textContent = b.over ? "BATTLE OVER" : b.phase === "enemy" ? "ENEMY TURN…" : "YOUR TURN — ROUND " + b.round;
  renderActionBar();
}
function renderActionBar(){
  const b = battle; if(!b) return;
  const bar = $("actionBar"); if(!bar) return;
  if(b.over || b.phase === "enemy"){
    bar.innerHTML = '<div class="ab-unit"><div><b>' + (b.over ? "Battle over" : "Enemies are acting…") + "</b>" +
      "<small>Watch the stage — your turn is next.</small></div></div>";
    return;
  }
  const actor = b.allies[b.active];
  if(!actor || !actor.alive){ bar.innerHTML = ""; return; }
  const skillOk = b.energy >= actor.cost && !b.animating;
  const ultOk = actor.ultCharge >= 100 && !b.animating;
  bar.innerHTML =
    '<div class="ab-unit">' +
      '<div class="ab-portrait">' + spriteHTML(actor.charId) + "</div>" +
      "<div><b>" + esc(actor.name) + "</b><small>HP " + actor.hp + " / " + actor.maxHp + " · Ult " + actor.ultCharge + "% · Tap an enemy to target it</small></div>" +
      '<button class="btn ghost ab-end" style="min-height:40px;padding:8px 12px" onclick="endRound()" ' + (b.animating ? "disabled" : "") + ">End Round ▸</button>" +
    "</div>" +
    '<div class="actions-grid">' +
      '<button class="action-btn" onclick="playerAction(\'attack\')" ' + (b.animating ? "disabled" : "") + "><b>⚔ Attack</b><small>Free · +25 Ult charge</small></button>" +
      '<button class="action-btn skill" onclick="playerAction(\'skill\')" ' + (skillOk ? "" : "disabled") + "><b>" + esc(actor.skill.name) + "</b><small>" + actor.cost + " energy · " + esc(actor.skill.desc) + "</small></button>" +
      '<button class="action-btn ult' + (ultOk ? " ready" : "") + '" onclick="playerAction(\'ult\')" ' + (ultOk ? "" : "disabled") + "><b>✦ " + esc(actor.ult.name) + "</b><small>" + (actor.ultCharge >= 100 ? "READY!" : actor.ultCharge + "% charged") + '</small><span class="ult-charge" style="width:' + actor.ultCharge + '%"></span></button>' +
    "</div>";
}
function onFighterTap(side, i){
  const b = battle; if(!b || b.over || b.animating) return;
  if(side === "enemy"){
    if(b.enemies[i] && b.enemies[i].alive){ b.target = i; updateBattleUI(); }
    return;
  }
  // Tap an ally to switch the acting hero (if they still have a move).
  if(b.phase === "player" && b.allies[i] && b.allies[i].alive && !b.acted.has(i)){
    b.active = i; updateBattleUI();
  }
}
function logLine(msg){
  const b = battle; if(!b) return;
  b.log.push(msg); if(b.log.length > 3) b.log.shift();
  const el = $("battleLog");
  if(el) el.innerHTML = b.log.map((l,i) => i === b.log.length-1 ? "<b>" + l + "</b>" : l).join("<br>");
}
function spawnFloater(side, idx, text, cls){
  const stage = $("stage"); const el = $("f-" + side + "-" + idx);
  const layer = $("floatLayer");
  if(!stage || !el || !layer) return;
  const sr = stage.getBoundingClientRect(); const r = el.getBoundingClientRect();
  const span = document.createElement("span");
  span.className = "dmg-num " + (cls || "");
  span.textContent = text;
  span.style.left = (r.left - sr.left + r.width / 2) + "px";
  span.style.top = (r.top - sr.top + r.height * 0.25) + "px";
  layer.appendChild(span);
  setTimeout(() => span.remove(), 1050);
}
/* Louvayn's original damage formula, plus a 15% critical hit (×1.5). */
function calcDamage(atk, def){
  const base = Math.max(5, atk - Math.floor(def / 2));
  const crit = Math.random() < 0.15;
  return { dmg: crit ? Math.round(base * 1.5) : base, crit };
}
function applyDamage(u, dmg){
  u.hp = Math.max(0, u.hp - dmg);
  if(u.hp <= 0) u.alive = false;
  else if(!u.isEnemy) u.ultCharge = Math.min(100, u.ultCharge + 12); // taking a hit charges your Ult
}
function healUnit(u, amount){
  const healed = Math.min(amount, u.maxHp - u.hp);
  u.hp += healed;
  return healed;
}

/* ---- player input ---- */
function playerAction(action){
  const b = battle; if(!b || b.over || b.animating || b.phase !== "player") return;
  const actor = b.allies[b.active];
  if(!actor || !actor.alive || b.acted.has(b.active)) return;
  if(action === "skill" && b.energy < actor.cost){ showToast("Not enough energy — attack to build up, or end the round for +2."); return; }
  if(action === "ult" && actor.ultCharge < 100){ showToast("Ultimate isn't charged yet!"); return; }
  const idx = b.active;
  resolveAction(actor, "ally", action, b.target, () => {
    b.acted.add(idx);
    advanceTurn();
  });
}
function endRound(){
  const b = battle; if(!b || b.over || b.animating || b.phase !== "player") return;
  b.allies.forEach((a,i) => { if(a.alive) b.acted.add(i); });
  enemyPhase();
}
function advanceTurn(){
  const b = battle; if(!b || b.over) return;
  const next = b.allies.findIndex((a,i) => a.alive && !b.acted.has(i));
  if(next === -1){ enemyPhase(); return; }
  b.active = next;
  updateBattleUI();
}

/* ---- the heart of combat: one action, animated, for either side ---- */
function resolveAction(actor, side, action, targetIdx, done){
  const b = battle;
  b.animating = true;
  const isAlly = side === "ally";
  const foes = isAlly ? b.enemies : b.allies;
  const friends = isAlly ? b.allies : b.enemies;
  const actorIdx = (isAlly ? b.allies : b.enemies).indexOf(actor);
  const actorEl = $("f-" + side + "-" + actorIdx);

  // Pick the effect and (for damage) the target.
  let effect = null, target = null, tIdx = -1;
  if(action === "attack"){
    tIdx = targetIdx != null ? targetIdx : b.target;
    if(!foes[tIdx] || !foes[tIdx].alive) tIdx = foes.findIndex(u => u.alive);
    target = foes[tIdx];
    effect = { type:"damage", amount:0 };
  } else {
    effect = action === "skill" ? actor.skill : actor.ult;
    if(effect.type === "damage"){
      tIdx = targetIdx != null ? targetIdx : b.target;
      if(!foes[tIdx] || !foes[tIdx].alive) tIdx = foes.findIndex(u => u.alive);
      target = foes[tIdx];
    }
  }
  // Enemies can't use energy — the Guardian's blessing mends a wounded ally instead.
  if(!isAlly && effect.type === "energy") effect = { type:"healLowest", amount:40 };
  if(!isAlly && effect.type === "energyTeam") effect = { type:"healTeam", amount:40 };

  // Costs (player side only).
  if(isAlly){
    if(action === "skill") b.energy = Math.max(0, b.energy - actor.cost);
    if(action === "ult") actor.ultCharge = 0;
    if(action === "skill") actor.ultCharge = Math.min(100, actor.ultCharge + 10);
    if(action === "attack") actor.ultCharge = Math.min(100, actor.ultCharge + 25);
  }

  const label = action === "attack" ? "Attack" : (action === "skill" ? actor.skill.name : actor.ult.name);
  logLine("<b>" + esc(actor.name) + "</b> used <b>" + esc(label) + "</b>!");
  if(actorEl) actorEl.classList.add(isAlly ? "lunge-ally" : "lunge-enemy");
  const isBig = action === "ult";

  setTimeout(() => {
    if(!battle) return;
    if(actorEl) actorEl.classList.remove("lunge-ally", "lunge-enemy");
    if(effect.type === "damage"){
      if(!target || !target.alive){ finishAction(); return; }
      let dmg, crit = false;
      if(action === "attack"){ const r = calcDamage(actor.atk, target.def); dmg = r.dmg; crit = r.crit; }
      else dmg = effect.amount;
      applyDamage(target, dmg);
      const tEl = $("f-" + (isAlly ? "enemy" : "ally") + "-" + tIdx);
      if(tEl){ tEl.classList.add("hit"); setTimeout(() => tEl.classList.remove("hit"), 380); }
      if(isBig || crit || dmg >= 80){
        const st = $("stage");
        if(st){ st.classList.add("shake"); setTimeout(() => st.classList.remove("shake"), 420); }
      }
      spawnFloater(isAlly ? "enemy" : "ally", tIdx, (crit ? "CRIT " : "") + "-" + dmg, crit ? "crit" : "");
      logLine(esc(target.name) + " took <b>" + dmg + "</b> damage" + (crit ? " — critical hit!" : "."));
    } else if(effect.type === "healSelf"){
      const healed = healUnit(actor, effect.amount);
      if(actorEl){ actorEl.classList.add("heal-glow"); setTimeout(() => actorEl.classList.remove("heal-glow"), 700); }
      spawnFloater(side, actorIdx, "+" + healed + " HP", "heal");
      logLine(esc(actor.name) + " recovered <b>" + healed + "</b> HP.");
    } else if(effect.type === "healTeam"){
      friends.forEach((u,i) => {
        if(!u.alive) return;
        const healed = healUnit(u, effect.amount);
        if(healed > 0) spawnFloater(side, i, "+" + healed, "heal");
        const el = $("f-" + side + "-" + i);
        if(el){ el.classList.add("heal-glow"); setTimeout(() => el.classList.remove("heal-glow"), 700); }
      });
      logLine(esc(actor.name) + " healed the whole team!");
    } else if(effect.type === "healLowest"){
      const hurt = friends.filter(u => u.alive).sort((x,y) => (x.hp/x.maxHp) - (y.hp/y.maxHp))[0];
      if(hurt){
        const healed = healUnit(hurt, effect.amount);
        spawnFloater(side, friends.indexOf(hurt), "+" + healed, "heal");
      }
      logLine(esc(actor.name) + " mended a wounded ally.");
    } else if(effect.type === "energy"){
      b.energy = Math.min(10, b.energy + effect.amount);
      spawnFloater(side, actorIdx, "+" + effect.amount + " ENERGY", "energy");
      logLine("Team energy restored by <b>" + effect.amount + "</b>.");
    } else if(effect.type === "energyTeam"){
      b.energy = Math.min(10, b.energy + effect.amount);
      friends.forEach((u,i) => { if(u.alive){ const h = healUnit(u, 30); if(h > 0) spawnFloater(side, i, "+" + h, "heal"); } });
      spawnFloater(side, actorIdx, "+" + effect.amount + " ENERGY", "energy");
      logLine("Aegis of Dawn — energy and healing for the whole team!");
    }
    updateBattleUI();
    finishAction();
  }, action === "attack" ? 240 : 340);

  function finishAction(){
    if(!battle) return;
    b.animating = false;
    if(checkEnd()) return;
    if(done) done();
  }
}

/* ---- enemy AI: attack, or use a skill on cooldown; prefers weak targets ---- */
function pickEnemyTarget(){
  const b = battle;
  const alive = b.allies.map((a,i) => i).filter(i => b.allies[i].alive);
  if(!alive.length) return -1;
  if(Math.random() < 0.5){
    return alive.sort((x,y) => (b.allies[x].hp / b.allies[x].maxHp) - (b.allies[y].hp / b.allies[y].maxHp))[0];
  }
  return alive[Math.floor(Math.random() * alive.length)];
}
function enemyPhase(){
  const b = battle; if(!b || b.over) return;
  b.phase = "enemy";
  updateBattleUI();
  const foes = b.enemies.map((e,i) => i).filter(i => b.enemies[i].alive);
  let step = 0;
  function next(){
    if(!battle || battle.over) return;
    if(step >= foes.length){ startNewRound(); return; }
    const ei = foes[step++];
    const e = b.enemies[ei];
    if(!e.alive){ next(); return; }
    const targetIdx = pickEnemyTarget();
    if(targetIdx < 0){ checkEnd(); return; }
    const useSkill = e.skillCd <= 0 && Math.random() < 0.4;
    if(useSkill) e.skillCd = 2;
    resolveAction(e, "enemy", useSkill ? "skill" : "attack", targetIdx, () => setTimeout(next, 380));
  }
  setTimeout(next, 650);
}
function startNewRound(){
  const b = battle; if(!b || b.over) return;
  b.round++;
  b.energy = Math.min(10, b.energy + 2);
  b.acted.clear();
  b.enemies.forEach(e => { if(e.skillCd > 0) e.skillCd--; });
  b.active = b.allies.findIndex(a => a.alive);
  b.phase = "player";
  logLine("Round " + b.round + " — your turn. +2 energy.");
  updateBattleUI();
}
function checkEnd(){
  const b = battle; if(!b || b.over) return false;
  if(!b.enemies.some(u => u.alive)){ endBattle(true); return true; }
  if(!b.allies.some(u => u.alive)){ endBattle(false); return true; }
  return false;
}
function endBattle(win){
  const b = battle; if(!b || b.over) return;
  b.over = true; b.phase = "over";
  save.battles++;
  updateBattleUI();
  if(win){
    save.wins++;
    save.credits += b.reward.credits;
    gainXP(b.reward.xp);
    if(b.mode === "story"){
      if(!save.cleared.includes(b.chapter.id)) save.cleared.push(b.chapter.id);
      save.unlocked = Math.max(save.unlocked, Math.min(6, b.chapter.id + 1));
    } else {
      save.wave++;
      save.bestWave = Math.max(save.bestWave, save.wave);
    }
    saveGame();
    const nextCh = b.mode === "story" ? CHAPTERS.find(c => c.id === b.chapter.id + 1) : null;
    modal(
      '<div class="result"><div class="eyebrow">BATTLE WON</div><h2 class="gold">VICTORY!</h2>' +
      "<p>" + (b.mode === "story"
        ? (nextCh ? "Chapter " + b.chapter.num + " cleared — Chapter " + nextCh.num + " is now unlocked!" : "You cleared the final chapter. The Rift is closed — the saga is complete!")
        : "Wave " + (save.wave - 1) + " cleared! The shadows grow stronger…") + "</p>" +
      '<div class="reward-row"><div><b>◆ +' + b.reward.credits + "</b><span>CREDITS</span></div>" +
      '<div><b>★ +' + b.reward.xp + "</b><span>XP</span></div></div></div>" +
      '<div class="dialog-buttons">' +
      (b.mode === "arena"
        ? '<button class="btn primary" onclick="nextArenaWave()">Next Wave ⚔</button>'
        : nextCh
          ? '<button class="btn primary" onclick="leaveBattle();navigate(\'story\')">Continue Story ▸</button>'
          : '<button class="btn primary" onclick="leaveBattle();navigate(\'home\')">Back Home</button>') +
      '<button class="btn ghost" onclick="leaveBattle()">Leave</button></div>',
      "RESULT");
  } else {
    if(b.mode === "arena") save.wave = 1;
    saveGame();
    modal(
      '<div class="result"><div class="eyebrow">BATTLE LOST</div><h2 class="pink">DEFEAT</h2>' +
      "<p>" + (b.mode === "arena"
        ? "The Rift Shadows overwhelmed your party. Wave progress reset to 1 — but your heroes keep their XP."
        : "Your party fell. Train in the Arena, summon stronger heroes, and try again!") + "</p></div>" +
      '<div class="dialog-buttons">' +
      '<button class="btn primary" onclick="retryBattle()">↻ Retry Battle</button>' +
      '<button class="btn ghost" onclick="leaveBattle()">Leave</button></div>',
      "RESULT");
  }
}
function leaveBattle(){
  if(battle && !battle.over){
    if(!confirm("Leave this battle? Your progress in this fight will be lost.")) return;
  }
  battle = null;
  closeModal();
  document.body.classList.remove("in-battle");
  navigate(currentScreen);
}
function retryBattle(){
  const b = battle; if(!b) return;
  const mode = b.mode, ch = b.chapter;
  closeModal();
  battle = null;
  startBattle(mode, ch);
}
function nextArenaWave(){
  closeModal();
  battle = null;
  startBattle("arena", null);
}

/* ================= 9) ARENA ================= */
function renderArena(){
  return '' +
  '<div class="arena-hero">' +
    '<div class="eyebrow">ENDLESS MODE · RIFT SHADOWS</div>' +
    '<div class="wave-num">WAVE ' + save.wave + "</div>" +
    "<h2>Battle Arena</h2>" +
    "<p>Face endless waves of Rift Shadows — shadow versions of the heroes, growing stronger every wave. Earn credits and XP to power up your team.</p>" +
    '<div style="display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap">' +
      '<span class="chip gold">BEST WAVE: ' + Math.max(save.bestWave, save.wave) + "</span>" +
      '<span class="chip cyan">WINS: ' + save.wins + "</span>" +
      '<span class="chip pink">REWARD: ◆ ' + (40 + save.wave * 12) + " · ★ " + (30 + save.wave * 8) + " XP</span>" +
    "</div>" +
    '<button class="btn primary block" style="max-width:340px;margin:0 auto" onclick="startBattle(\'arena\')">⚔ Start Wave ' + save.wave + "</button>" +
  "</div>" +
  '<div class="card" style="padding:16px;margin-top:14px">' +
    "<h3 style=\"font-size:17px;margin-bottom:6px\">How the Arena works</h3>" +
    '<p style="font-size:15px;line-height:1.6;color:#c0cce0">Waves 1–2: one shadow. Waves 3–5: two. Wave 6 and beyond: three — and every wave they hit harder. ' +
    "Lose a wave and you restart at Wave 1, so bank your credits in the Summon screen often. " +
    "The Arena is the fastest way to level up and save for 10× summons.</p>" +
  "</div>";
}

/* ================= 10) PROFILE + INIT ================= */
function showProfile(){
  const pct = Math.min(100, Math.round(save.xp / xpNeeded() * 100));
  modal(
    "<h2>Runner Profile</h2>" +
    "<p>Level " + save.level + " · " + save.xp + " / " + xpNeeded() + " XP to next level</p>" +
    '<div class="xpbar" style="height:8px;margin:10px 0 16px"><i style="width:' + pct + '%"></i></div>' +
    '<div class="stat-grid">' +
      '<div class="stat-box"><b>◆ ' + fmt(save.credits) + "</b><span>CREDITS</span></div>" +
      '<div class="stat-box"><b>✦ ' + fmt(save.shards) + "</b><span>SHARDS</span></div>" +
      '<div class="stat-box"><b>' + save.owned.length + "/12</b><span>HEROES</span></div>" +
      '<div class="stat-box"><b>' + save.wins + "</b><span>WINS</span></div>" +
    "</div>" +
    '<div class="stat-grid">' +
      '<div class="stat-box"><b>' + save.cleared.length + "/6</b><span>CHAPTERS</span></div>" +
      '<div class="stat-box"><b>' + Math.max(save.bestWave, save.wave) + "</b><span>BEST WAVE</span></div>" +
      '<div class="stat-box"><b>' + save.battles + "</b><span>BATTLES</span></div>" +
      '<div class="stat-box"><b>LV ' + save.level + "</b><span>LEVEL</span></div>" +
    "</div>" +
    '<div class="dialog-buttons">' +
      '<button class="btn danger" onclick="resetProgress()">Reset All Progress</button>' +
      '<button class="btn ghost" onclick="closeModal()">Close</button>' +
    "</div>",
    "PROFILE");
}
function resetProgress(){
  if(!confirm("Reset ALL progress — heroes, story, credits, everything? This cannot be undone.")) return;
  localStorage.removeItem(SAVE_KEY);
  save = structuredClone(DEFAULT_SAVE);
  saveGame(); closeModal(); navigate("home");
  showToast("Progress reset. A new saga begins!");
}

/* ---- boot ---- */
syncProfileChip();
navigate("home");
if(!save.seenIntro){
  save.seenIntro = true; saveGame();
  setTimeout(() => modal(
    "<h2>The sky split open.</h2>" +
    "<p>Welcome to <b>MYTHIC CLASH</b>. You begin with 4 heroes and 300 credits. Clear Chapter 1, earn credits, and summon new heroes from the Rift.</p>" +
    '<p style="margin-top:10px">Your party: <b>Sylvaine</b>, <b>Aurelia</b> and <b>Darius</b>. Good luck, Runner.</p>' +
    '<div class="dialog-buttons"><button class="btn primary" onclick="closeModal();navigate(\'story\')">▶ Start Chapter 1</button><button class="btn ghost" onclick="closeModal()">Explore First</button></div>',
    "WELCOME, RUNNER"), 600);
}
</script>
